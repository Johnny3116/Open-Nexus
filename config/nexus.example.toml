# Nexus configuration — copy to config/nexus.toml and edit.
# Secrets do NOT go here; they go in .env (referenced by ${ENV_VAR}).

[core]
# Identity files loaded into the system prompt, in order.
identity_dir = "identity"
# Hard token cap on Layer-1 (frozen core) memory. Forces consolidation.
core_memory_token_cap = 1500

[model]
# Active model. Swap with `nexus model <name>`. Because context is small and
# stable, swapping is cheap and prompt-caching stays warm.
active = "claude"
# Fallback chain with exponential backoff so a provider outage degrades, not dies.
fallback = ["claude", "openai", "local"]

# --- providers: every provider is treated as OpenAI-compatible-or-translated ---
[providers.claude]
kind = "anthropic"
model = "claude-opus-4-8"
api_key_env = "ANTHROPIC_API_KEY"

[providers.openai]
kind = "openai"
model = "gpt-4o"
api_key_env = "OPENAI_API_KEY"

[providers.openrouter]
kind = "openai"            # OpenAI-compatible API
base_url = "https://openrouter.ai/api/v1"
model = "anthropic/claude-opus-4-8"
api_key_env = "OPENROUTER_API_KEY"

[providers.local]
kind = "openai"            # Ollama exposes an OpenAI-compatible endpoint
base_url_env = "LOCAL_BASE_URL"
model = "llama3.1"

[memory]
backend = "supabase"
url_env = "SUPABASE_URL"
service_role_key_env = "SUPABASE_SERVICE_ROLE_KEY"
database_url_env = "DATABASE_URL"
embedding_model_env = "EMBEDDING_MODEL"
# Retrieval per turn: Layer1 (all, capped) + top-k FTS + top-k vector, deduped.
retrieval_fts_top_k = 8
retrieval_vector_top_k = 8

# --- channels: enable only what you use. Each enforces a per-channel allowlist ---
[channels.terminal]
enabled = true

[channels.web]
enabled = false
host = "127.0.0.1"
port = 8800

[channels.telegram]
enabled = false
token_env = "TELEGRAM_BOT_TOKEN"
allowlist = []             # platform-native user ids permitted to talk to Nexus

[channels.discord]
enabled = false
token_env = "DISCORD_BOT_TOKEN"
allowlist = []

[channels.slack]
enabled = false
bot_token_env = "SLACK_BOT_TOKEN"
app_token_env = "SLACK_APP_TOKEN"
allowlist = []

[scheduler]
# Heartbeat: review HEARTBEAT.md, ping only if something matters.
heartbeat_enabled = false
heartbeat_interval_seconds = 1800
# Cron: natural-language jobs in fresh isolated sessions, results routed to a channel.
cron_enabled = false

[tools]
# The approval gate. Irreversible/external actions require explicit human yes.
approval_required = [
    "remote_control",
    "file_delete",
    "send_message",
    "spend_money",
]

[senses]
voice_enabled = false
screen_enabled = false       # opt-in per session, never silent
remote_control_enabled = false
vtube_enabled = false
vtube_ws_env = "VTUBE_STUDIO_WS"

[delegation]
jarvis_enabled = false
endpoint_env = "JARVIS_ENDPOINT"
