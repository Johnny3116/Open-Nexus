[project]
name = "open-nexus"
version = "0.0.1"
description = "A model-agnostic conversational agent harness. Nexus is a persona that runs on it."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "TBD" }
authors = [{ name = "Open-Nexus" }]
# Phase-0 base is deliberately tiny: no cloud SDKs, no Docker. SQLite is stdlib.
# Provider/channel SDKs are optional extras, added per phase.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
supabase = ["supabase>=2.5"]
telegram = ["aiogram>=3.4"]
discord = ["discord.py>=2.3"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "websockets>=12.0"]

[project.scripts]
open-nexus = "open_nexus.app:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-pyyaml>=6.0",
    "fastapi>=0.110",  # for the API TestClient in tests/unit
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_nexus"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
packages = ["open_nexus"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs local services (Supabase/Postgres/Docker).",
    "live: hits a real provider; manual, never in CI.",
]
